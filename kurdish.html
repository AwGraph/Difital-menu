<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>مێنیوی کوردی</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea, #764ba2);
      padding: 25px 15px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: auto;
    }

    .menu-card {
      background: white;
      border-radius: 26px;
      padding: 30px 22px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.20);
      text-align: center;
    }

    h1 {
      font-size: 30px;
      color: #222;
      margin-bottom: 12px;
    }

    .subtitle {
      color: #777;
      font-size: 17px;
      margin-bottom: 30px;
    }

    .menu-placeholder {
      min-height: 420px;
      border-radius: 20px;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      color: #777;
      font-size: 20px;
      margin-bottom: 25px;
    }

    .back-btn {
      display: block;
      width: 100%;
      padding: 17px;
      border-radius: 17px;
      text-decoration: none;
      color: white;
      font-size: 20px;
      font-weight: bold;
      background: linear-gradient(90deg, #e56de4, #ff4f76);
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="menu-card">

      <h1>مێنیوی کوردی</h1>

      <div class="subtitle">
        مێنیو
      </div>

      <div class="menu-placeholder">
        وێنەی مێنیو لێرە دادەنرێت
      </div>

      <a href="index.html" class="back-btn">
        گەڕانەوە
      </a>

    </div>

  </div>

</body>
</html>
